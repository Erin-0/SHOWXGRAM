<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SHOP×GRAM — Founder's Pocket v9</title>
  <meta name="description" content="Mobile-first social-commerce tycoon sim. Buy low, post smart, ship fast.">
  <meta name="theme-color" content="#EFEAD9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SHOP×GRAM">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #EFEAD9;
      --card: #FAF7EC;
      --ink: #191610;
      --ink2: #6B6353;
      --line: rgba(25, 22, 16, .28);
      --green: #0C6B43;
      --red: #C43A21;
      --amber: #C08A12;
      --gold: #B8860B;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --disp: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --tabh: 58px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none
    }

    body {
      background: var(--paper);
      background-image: repeating-linear-gradient(0deg, rgba(25, 22, 16, .045) 0 1px, transparent 1px 34px), repeating-linear-gradient(90deg, rgba(25, 22, 16, .03) 0 1px, transparent 1px 34px);
      color: var(--ink);
      font-family: var(--disp);
      font-size: 14px;
      touch-action: manipulation;
    }

    button {
      font-family: var(--disp);
      touch-action: manipulation
    }

    img {
      max-width: 100%
    }

    .dim {
      color: var(--ink2)
    }

    .g {
      color: var(--green)
    }

    .r {
      color: var(--red)
    }

    .a {
      color: var(--amber)
    }

    .gold {
      color: var(--gold)
    }

    .mono {
      font-family: var(--mono)
    }

    .hide {
      display: none !important
    }

    .ic {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -3px;
      flex: none
    }

    .ic.sm {
      width: 14px;
      height: 14px;
      vertical-align: -2px
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column
    }

    .topbar {
      flex: none;
      background: var(--card);
      border-bottom: 2px solid var(--ink);
      padding: calc(var(--sat) + 4px) calc(10px + var(--sar)) 6px calc(10px + var(--sal));
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 40
    }

    .tb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0
    }

    .tb-brand {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -.5px;
      flex: none
    }

    .tb-brand em {
      font-style: normal;
      color: var(--green)
    }

    .tb-ver {
      font: 600 7px var(--mono);
      letter-spacing: .14em;
      color: var(--ink2);
      display: block;
      margin-top: -2px
    }

    .tb-bal {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 8px;
      text-align: right;
      transition: background .2s
    }

    .tb-bal:active {
      background: var(--paper)
    }

    .bal-lab {
      font: 700 7px var(--mono);
      letter-spacing: .2em;
      color: var(--ink2)
    }

    .bal {
      font: 700 19px var(--mono);
      letter-spacing: -.5px;
      line-height: 1.15;
      white-space: nowrap
    }

    .bal.neg {
      color: var(--red)
    }

    @keyframes gPulse {
      0% {
        background: #CFE8DA
      }

      100% {
        background: transparent
      }
    }

    @keyframes rPulse {
      0% {
        background: #F2D3C8
      }

      100% {
        background: transparent
      }
    }

    .tb-bal.credit {
      animation: gPulse .8s
    }

    .tb-bal.debit {
      animation: rPulse .8s
    }

    .iconbtn {
      position: relative;
      min-width: 44px;
      height: 44px;
      border: 2px solid var(--ink);
      border-radius: 11px;
      background: var(--card);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none
    }

    .iconbtn:active {
      transform: translate(1px, 1px)
    }

    .iconbtn.active {
      background: var(--ink);
      color: var(--card)
    }

    .iconbtn .bdg {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--red);
      color: #fff;
      font: 700 9px/18px var(--mono);
      text-align: center;
      padding: 0 4px;
      border: 1.5px solid var(--card)
    }

    .econ-chip {
      font: 700 8.5px var(--mono);
      letter-spacing: .06em;
      border: 1.5px solid var(--ink);
      border-radius: 7px;
      padding: 4px 7px;
      background: var(--paper);
      white-space: nowrap;
      flex: none
    }

    .econ-chip.boom {
      background: #CFE8DA;
      border-color: var(--green);
      color: var(--green)
    }

    .econ-chip.recession {
      background: #F2D3C8;
      border-color: var(--red);
      color: var(--red)
    }

    .clock {
      flex: 1;
      min-width: 0;
      font: 600 9.5px var(--mono);
      letter-spacing: .02em;
      border: 1.5px solid var(--ink);
      border-radius: 7px;
      padding: 5px 7px;
      background: var(--paper);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .clock.paused {
      color: var(--amber)
    }

    .seg {
      display: flex;
      border: 2px solid var(--ink);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
      flex: none
    }

    .seg button {
      min-width: 40px;
      height: 36px;
      border: none;
      background: none;
      font: 700 10.5px var(--mono);
      cursor: pointer;
      color: var(--ink2);
      display: grid;
      place-items: center;
      padding: 0 4px
    }

    .seg button+button {
      border-left: 2px solid var(--ink)
    }

    .seg button.active {
      background: var(--ink);
      color: var(--card)
    }

    .seg button .ic {
      width: 13px;
      height: 13px;
      vertical-align: 0
    }

    .ticker {
      flex: none;
      height: 24px;
      background: var(--ink);
      color: var(--card);
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: pointer;
      contain: layout
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      font: 500 9px var(--mono);
      letter-spacing: .12em;
      padding-left: 10px
    }

    .tk {
      padding-right: 28px;
      display: inline-flex;
      align-items: center
    }

    .tk i {
      font-style: normal;
      color: rgba(243, 237, 220, .35);
      margin-left: 20px
    }

    .pages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 12px 24px calc(12px);
      scroll-behavior: auto
    }

    .page-head {
      padding: 2px 2px 10px;
      border-bottom: 1.5px dashed var(--line);
      margin: 0 0 12px
    }

    .page-head h2 {
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -.4px;
      line-height: 1.1
    }

    .page-head .meta {
      font: 600 8.5px var(--mono);
      letter-spacing: .08em;
      color: var(--ink2);
      margin-top: 4px;
      line-height: 1.5;
      overflow-wrap: break-word
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .tabbar {
      flex: none;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--card);
      border-top: 2px solid var(--ink);
      padding: 4px calc(4px + var(--sar)) calc(4px + var(--sab)) calc(4px + var(--sal));
      z-index: 40
    }

    .tabbtn {
      position: relative;
      height: 52px;
      border: 2px solid transparent;
      border-radius: 11px;
      background: none;
      color: var(--ink2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      font: 700 8px var(--mono);
      letter-spacing: .08em
    }

    .tabbtn .ic {
      width: 20px;
      height: 20px
    }

    .tabbtn.active {
      background: var(--ink);
      color: var(--card);
      border-color: var(--ink)
    }

    .tabbtn .bdg {
      position: absolute;
      top: 2px;
      right: calc(50% - 22px);
      min-width: 17px;
      height: 17px;
      border-radius: 9px;
      background: var(--red);
      color: #fff;
      font: 700 9px/17px var(--mono);
      text-align: center;
      padding: 0 4px;
      border: 1.5px solid var(--card)
    }

    .tabbtn .bdg.dot {
      min-width: 10px;
      height: 10px;
      border-radius: 5px;
      padding: 0;
      right: calc(50% - 18px);
      top: 5px
    }

    .tabbtn .bdg.dot.gold {
      background: var(--gold)
    }

    .btn {
      font: 700 11px var(--mono);
      letter-spacing: .08em;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: var(--card);
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 11px;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 3px 3px 0 rgba(25, 22, 16, .3);
      transition: transform .06s;
      text-align: center;
      line-height: 1.2
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none
    }

    .btn.green {
      background: var(--green);
      border-color: var(--green)
    }

    .btn.gold {
      background: var(--gold);
      border-color: var(--gold)
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink)
    }

    .btn.danger {
      background: transparent;
      color: var(--red);
      border-color: var(--red)
    }

    .btn.small {
      min-height: 44px;
      padding: 8px 11px;
      font-size: 10px
    }

    .btn.wide {
      width: 100%
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none
    }

    .card {
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 4px 4px 0 rgba(25, 22, 16, .85);
      overflow: hidden
    }

    .card.pad {
      padding: 13px
    }

    .card h3 {
      font: 800 13px var(--mono);
      letter-spacing: .08em;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font: 600 10px var(--mono);
      letter-spacing: .04em;
      padding: 4px 0;
      border-top: 1px dashed var(--line);
      overflow-wrap: anywhere
    }

    .kv:first-of-type {
      border-top: none
    }

    .kv span {
      color: var(--ink2);
      flex: none
    }

    .kv b {
      font-weight: 700;
      text-align: right
    }

    .empty {
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      font: 600 10.5px var(--mono);
      color: var(--ink2);
      line-height: 1.7;
      background: rgba(250, 247, 236, .5)
    }

    details.fold {
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 4px 4px 0 rgba(25, 22, 16, .85);
      overflow: hidden
    }

    details.fold>summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 14px;
      cursor: pointer;
      font: 800 12px var(--mono);
      letter-spacing: .08em;
      min-height: 48px;
      user-select: none
    }

    details.fold>summary::-webkit-details-marker {
      display: none
    }

    details.fold>summary .chev {
      margin-left: auto;
      transition: transform .18s;
      flex: none
    }

    details.fold[open]>summary .chev {
      transform: rotate(90deg)
    }

    details.fold>summary .sum-meta {
      font: 600 8.5px var(--mono);
      color: var(--ink2);
      letter-spacing: .06em;
      margin-left: auto;
      margin-right: 6px;
      text-align: right
    }

    details.fold .foldbody {
      padding: 0 13px 13px;
      border-top: 1.5px dashed var(--line)
    }

    .meter {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .meter label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font: 700 9px var(--mono);
      letter-spacing: .1em;
      color: var(--ink2)
    }

    .meter label b {
      color: var(--ink);
      font-size: 11.5px
    }

    .mbar {
      height: 8px;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      overflow: hidden;
      background: var(--paper)
    }

    .mbar i {
      display: block;
      height: 100%;
      background: var(--green);
      width: 0
    }

    .mbar i.low {
      background: var(--red)
    }

    .mbar i.mid {
      background: var(--amber)
    }

    .chipstat {
      font: 700 8px var(--mono);
      letter-spacing: .1em;
      border: 1.5px solid currentColor;
      border-radius: 6px;
      padding: 3px 7px;
      white-space: nowrap
    }

    .chipstat.ok {
      color: var(--green)
    }

    .chipstat.bad {
      color: var(--red)
    }

    .chipstat.warn {
      color: var(--amber)
    }

    .chipstat.gold {
      color: var(--gold)
    }

    .chipstat.neutral {
      color: var(--ink2)
    }

    .tierchip {
      font: 700 8px var(--mono);
      letter-spacing: .12em;
      border: 1.5px solid var(--ink);
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap
    }

    .post {
      border: 2px solid var(--ink);
      border-radius: 15px;
      background: var(--card);
      box-shadow: 4px 4px 0 var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .post-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: none;
      background: var(--ink);
      color: var(--card);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font: 700 9px var(--mono)
    }

    .ph-main {
      flex: 1;
      min-width: 0
    }

    .ph-main b {
      font-size: 13px;
      display: block;
      overflow-wrap: anywhere
    }

    .ph-main span {
      font: 500 8.5px var(--mono);
      letter-spacing: .05em;
      color: var(--ink2)
    }

    .livechip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font: 700 8px var(--mono);
      letter-spacing: .1em;
      color: var(--card);
      background: var(--green);
      border-radius: 6px;
      padding: 4px 7px;
      flex: none
    }

    .livechip i {
      width: 5px;
      height: 5px;
      background: var(--card);
      border-radius: 50%;
      animation: blink 1.1s infinite
    }

    @keyframes blink {
      50% {
        opacity: .15
      }
    }

    .post-img {
      position: relative;
      aspect-ratio: 4/3;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      background: var(--paper)
    }

    .post-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .stamp {
      position: absolute;
      top: 10px;
      right: 10px;
      transform: rotate(3deg);
      font: 700 9px var(--mono);
      letter-spacing: .1em;
      border: 2px solid currentColor;
      border-radius: 6px;
      padding: 3px 7px;
      background: rgba(250, 247, 236, .92)
    }

    .stamp.green {
      color: var(--green)
    }

    .stamp.red {
      color: var(--red)
    }

    .stamp.amber {
      color: var(--amber)
    }

    .stamp.gold {
      color: var(--gold)
    }

    .stamp.s2 {
      top: 40px
    }

    .stamp.s3 {
      top: 70px
    }

    .post-body {
      padding: 11px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline
    }

    .title-row h3 {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.2px;
      overflow-wrap: anywhere
    }

    .price {
      font: 700 14px var(--mono);
      flex: none
    }

    .desc {
      font-size: 12px;
      line-height: 1.5;
      color: #3d382e;
      overflow-wrap: break-word
    }

    .meta-line {
      font: 600 9px var(--mono);
      letter-spacing: .04em;
      color: var(--ink2);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px
    }

    .meta-line b {
      color: var(--ink)
    }

    .lifebar {
      height: 5px;
      background: rgba(25, 22, 16, .15);
      border-radius: 3px;
      overflow: hidden
    }

    .lifebar i {
      display: block;
      height: 100%;
      background: var(--green);
      width: 0
    }

    .lifebar i.mature {
      background: var(--amber)
    }

    .lifebar i.decline {
      background: var(--red)
    }

    .camps {
      display: flex;
      flex-direction: column
    }

    .camp {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px dashed var(--line);
      padding: 7px 0 3px
    }

    .camp-l {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .cstat {
      font: 700 9px var(--mono);
      letter-spacing: .08em;
      color: var(--green);
      overflow-wrap: anywhere
    }

    .cvel {
      font: 500 9px var(--mono);
      color: var(--ink2);
      white-space: nowrap
    }

    .pbar {
      height: 4px;
      background: rgba(25, 22, 16, .15);
      border-radius: 2px;
      overflow: hidden
    }

    .pbar i {
      display: block;
      height: 100%;
      background: var(--ink);
      width: 0
    }

    .actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr 44px;
      gap: 7px;
      align-items: stretch
    }

    .actions .btn {
      width: 100%
    }

    .rev {
      font: 500 9.5px/1.5 var(--mono);
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper)
    }

    .rev.pos {
      border-color: var(--green);
      color: var(--green)
    }

    .rev.neg {
      border-color: var(--red);
      color: var(--red)
    }

    .wcard {
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 4px 4px 0 var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .wcard.vip {
      border-color: var(--gold);
      box-shadow: 4px 4px 0 var(--gold)
    }

    .wcard.mine {
      border-color: var(--green);
      box-shadow: 4px 4px 0 var(--green)
    }

    .wtop {
      display: flex;
      gap: 10px;
      padding: 10px
    }

    .wimg {
      width: 88px;
      height: 88px;
      flex: none;
      border: 2px solid var(--ink);
      border-radius: 10px;
      overflow: hidden;
      background: var(--paper);
      position: relative
    }

    .wimg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .winfo {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .wname {

      const cs = SZ / 4;
      for (let gy = 0; gy < 4; gy++)for (let gx = 0; gx < 4; gx++) {
        if (r() < .42) continue;
        const t = Math.floor(r() * 5), c = r() < .76 ? pal[1] : pal[2], X = gx * cs, Y = gy * cs, cx = X + cs / 2, cy = Y + cs / 2;
        x.fillStyle = c; x.strokeStyle = c;

    /* ==== ECONOMY CYCLES ==== */

    /* ==== COMPETITORS — v9 SCALING ==== */
    function makeCompetitor(markets) {
      const names = ['MEGA MART', 'ARTISAN CO', 'SWIFT GOODS', 'URBAN CRAFT', 'DIGITAL NEST', 'PRIME EMPORIUM', 'NOVA SHOP', 'GLOBAL HUB', 'TITAN RETAIL', 'APEX COMMERCE', 'OMNI GOODS', 'VERTEX MARKET'];
      const playerRev = S.life.revenue;
      const scaleFactor = 1 + Math.log10(Math.max(1, playerRev / 1000));
      const warChest = Math.max(500, playerRev * 0.02 * scaleFactor);
      const tier = scaleFactor < 1.5 ? 'LOCAL' : scaleFactor < 2.5 ? 'REGIONAL' : scaleFactor < 3.5 ? 'NATIONAL' : 'GLOBAL';
      return {
        id: uid(), name: pick(names),
        priceMult: r2(0.85 + Math.random() * 0.4),
        trust: clamp(ri(50, 90) + Math.floor(scaleFactor * 5), 50, 98),
        adSpend: Math.round(warChest * 0.15),
        warChest: Math.round(warChest),
        markets: Array.isArray(markets) ? markets : [markets || 'USA'],
        c0: pick(PALS)[1],
        tier,
        strategy: pick(RIVAL_STRATEGIES),

        lastActionAt: 0,
        createdAt: S.gameH

    function initCompetitors() {

    }
    function competitorScore(c) {
      const pFactor = 1 / Math.max(0.5, c.priceMult);
      const tFactor = c.trust / 100;
      const aFactor = 1 + c.adSpend / 2000;
      return pFactor * tFactor * aFactor;
    }
    function playerScore() {
      if (!S.products.length) return 0;
      let avgPriceMult = 0; for (const p of S.products) avgPriceMult += p.price / p.cost;
      avgPriceMult = S.products.length ? avgPriceMult / S.products.length : 2;
      const pFactor = 1 / Math.max(0.5, avgPriceMult / 2.2);
      const tFactor = effTrust() / 100;
      const recentAds = S.life.adSpend > 0 ? Math.min(2, 1 + S.life.adSpend / 5000) : 1;
      return pFactor * tFactor * recentAds;
    }
    function computeMarketShare() {
      const ps = playerScore();
      let cs = 0;
      for (const c of S.competitors) {
        const mkts = Array.isArray(c.markets) ? c.markets : [c.markets || 'USA'];
        if (mkts.some(m => S.countries.includes(m))) cs += competitorScore(c);

      const playerRev = S.life.revenue;

    /* ==== PRODUCT LIFECYCLE ==== */
    function stageFor(product) {
      const age = S.gameH - product.createdAt;
      const total = 60 * 24;

      const month = Math.floor(day / 30);

    /* ==== CUSTOMER REVIEWS ==== */
    function addReview(p, positive, orderId) {
      if (!p.reviews) p.reviews = [];
      const text = positive ? pick(REV_POS) : pick(REV_NEG);
      const score = positive ? ri(4, 5) : ri(1, 2);
      p.reviews.unshift({ text, score, orderId, t: S.gameH });
      if (p.reviews.length > 10) p.reviews.pop();
      S.reviewCount++; if (positive) S.positiveReviews++; else S.negativeReviews++;
      logEvent('REVIEW', { product: p.name, positive, score });

    function productReviewMod(p) {
      if (!p.reviews || !p.reviews.length) return 1;
      let sum = 0; for (const r of p.reviews) sum += r.score;
      const avg = sum / p.reviews.length;
      return 0.5 + (avg / 5) * 0.65;
    }

    /* ==== PRICE / CVR / FIT ==== */
    const CATEGORY_CFG = {
      'HOME': { max: 12, sigma: 0.52, penalty: 1.5 },
      'ACCESSORY': { max: 16, sigma: 0.60, penalty: 1.3 },

    };
    function fitRatio(ratio, ideal, cat) {
      if (!(ratio > 0)) return 0;
      const cfg = CATEGORY_CFG[cat] || CATEGORY_CFG['HOME'];
      const elast = econPriceElasticity();
      const max = cfg.max / (elast > 1 ? 1.4 : 1) * (1 + upgBonus('priceTolerance') + ((S.brand?.prestige || 10) / 500));
      if (ratio > max) return 0;
      if (ratio < 0.65) return 0.12 * Math.max(0, ratio / 0.65);
      const sigma = cfg.sigma / elast;
      const x = Math.log(ratio / ideal) / sigma;
      let f = Math.exp(-0.5 * x * x);
      const softThreshold = ideal * 2.2 * (1 + upgBonus('priceTolerance'));
      if (ratio > softThreshold) f *= Math.pow(softThreshold / ratio, cfg.penalty);
      if (ratio > 8) f *= Math.pow(8 / ratio, 2.2);

    function marketFit(p) {

    function cvr(p) {

      const sea = seasonalityMult(cat);

      return base * mf * trustMult() * feverMult() * weekendMult() * (1 + roleSum('cs')) * st * sea * ecm * rev * (1 + upgBonus('convBonus')) * upgBonus('globalCvr');

    function quality(hasImg, capLen, tags) {

    function campCum(c, t) {

    function calcAdReach(budget, p, qScore, isCreator, creatorReach, source) {
      const sku = p.wid;

      const used = S.products.filter(x => x.wid === sku).reduce((s, x) => s + x.views, 0);
      const remainingRatio = Math.max(0.12, 1 - used / (audience * 3.2 + 2200));

    function getBranchById(id) { for (const cc in BRANCH_DEFS) { const b = BRANCH_DEFS[cc].find(x => x.id === id); if (b) return b } return null }
    function countryBranchWeight(cc) { let w = 0; for (const bid of (S.branchesOwned || [])) { const b = getBranchById(bid); if (b && b.cc === cc) w += b.weight } for (const cb of (S.customBranches || [])) if (cb.cc === cc) w += cb.weight; return w }

    function calcCustomBranchCostLatLng(lat, lng) {

    function autoManageInventory() {

      collectFranchiseIncome();
      if (S.gameH > S.vipEndsAt && Math.random() < 0.3) refreshVipSupplier();
      /* commod drift */
      if (S.commodities) {
        for (const k in S.commodities) {
          S.commodities[k] = r2(clamp(S.commodities[k] + (Math.random() - 0.5) * 0.05, 0.7, 1.5));
        }
      }
      rollEvents();

        S.wcost[w.id] = r2(clamp(S.wcost[w.id] * (0.94 + Math.random() * 0.12) * pbSupplierCost() * (0.9 + comMult * 0.1), w.cost * .7, w.cost * 1.4));

    function driftStocks() {
      if (!S.stocks) return;
      for (const st of S.stocks) {
        st.prev = st.price;
        const volatility = st.stable ? 0.002 : (0.02 + st.drift * 0.05);
        let drift = (Math.random() - 0.48) * volatility;
        if (st.sym === 'ADTECH' && S.life.adSpend > 1000) drift += 0.005;
        if (st.sym === 'RETAILX' && S.life.revenue > 5000) drift += 0.004;
        if (st.sym === 'SHIPCO') drift += (Math.random() - 0.5) * 0.01;
        st.price = r2(Math.max(0.01, st.price * (1 + drift)));
        st.history.push(st.price);
        if (st.history.length > 60) st.history.shift();

    /* ==== ONE-TIME PURCHASE AGENT ==== */

    function calcAgentFee(items) {
      let cost = 0, units = 0;
      for (const it of items) {
        const w = whById(it.wid); if (!w) continue;
        const unitCost = (S.wcost && S.wcost[it.wid] != null) ? S.wcost[it.wid] : w.cost;

    }

    function calcListingFees(items) {
      return r2(items.reduce((sum, it) => sum + Math.max(1, Math.round(it.unitCost / 1000)), 0));
    }

    function calcAgentProjection(items, totals, listingFees) {
      let revenue = 0;
      for (const it of items) revenue += it.sellPrice * it.qty;
      const platformFee = r2(revenue * 0.05 + 0.3 * totals.units);
      const shippingFee = r2(3.20 * totals.units);
      const totalPaid = r2(totals.cost + totals.fee + listingFees);
      const profit = r2(revenue - platformFee - shippingFee - totalPaid);
      return { revenue: r2(revenue), platformFee, shippingFee, profit };
    }

    function agentDuration(items) {
      let units = 0;
      for (const it of items) units += it.qty;
      return r2(Math.max(2, items.length * 1.5 + units / 10));

    /* ==== ONE-TIME AD CAMPAIGN AGENT ==== */

    function adTierBudget(p, tier) {
      const dynMax = Math.max(300, Math.min(6000, Math.round((p.cost * 0.55) + 200)));
      if (tier === 'light') return Math.max(15, Math.round(dynMax * 0.10));
      if (tier === 'medium') return Math.max(50, Math.round(dynMax * 0.35));

      const trending = (S.trends || []).slice(0, 3);

      return [...trending, ...pool].slice(0, 3);
    }

    function adAgentQualityScore() {
      return quality(true, 60, adAgentTags());
    }

    function predictAdReach(p, budget) {
      const q = adAgentQualityScore();
      return Math.round(calcAdReach(budget, p, q, false, 0, 'agent'));
    }

    function calcAdAgentTotals(products, tier) {
      let totalBudget = 0, totalReach = 0;
      const perProduct = [];
      for (const p of products) {
        const b = adTierBudget(p, tier);
        const L = predictAdReach(p, b);
        totalBudget += b;
        totalReach += L;
        perProduct.push({ pid: p.id, name: p.name, img: p.img, budget: b, estReach: L });
      }
      const agentFee = r2(30 + products.length * 12 + totalBudget * 0.03);
      const totalCost = r2(totalBudget + agentFee);
      const avgBudget = products.length ? r2(totalBudget / products.length) : 0;
      const duration = r2(Math.max(1, products.length * 0.5));
      return { perProduct, totalBudget: r2(totalBudget), totalReach, agentFee, totalCost, avgBudget, duration };
    }

    function launchAdAgent() {
      const products = S.products.filter(p => adAgentState.selected.has(p.id));
      if (!products.length) { toast('SELECT PRODUCTS', 'bad'); return; }

      const t = calcAdAgentTotals(products, adAgentState.tier);

      addMoney(-t.totalCost);
      S.life.adSpend = r2(S.life.adSpend + t.totalBudget);
      S.spendWindow = r2(S.spendWindow + t.totalBudget);
      S.life.fees = r2(S.life.fees + t.agentFee);

      if (!S.agentAdJobs) S.agentAdJobs = [];
      S.agentAdJobs.push({
        id: uid(),
        items: t.perProduct.map(x => ({ pid: x.pid, budget: x.budget })),
        startedAt: S.gameH,
        eta: S.gameH + t.duration,
        status: 'working'
      });

      activity(`Ad agent hired — ${products.length} campaigns · paid ${fmt$(t.totalCost)}`, -t.totalCost);
      toast(`AD AGENT HIRED — ${products.length} CAMPAIGNS QUEUED`, 'ok');
      notify('agent', `AD AGENT HIRED`, `${products.length} campaigns queued · ETA ~${Math.ceil(t.duration)}h`, 'store', 'ok');

    function progressAdAgentJobs() {
      if (!S.agentAdJobs || !S.agentAdJobs.length) return;
      let changed = false;
      for (const job of S.agentAdJobs) {
        if (job.status !== 'working') continue;
        if (S.gameH < job.eta) continue;
        job.status = 'done';
        let launched = 0;
        for (const item of job.items) {
          const p = byId(item.pid); if (!p) continue;
          const tags = adAgentTags();
          const q = quality(true, 60, tags);
          const auction = effOn('auction') ? 1.25 : 1;
          let L = calcAdReach(item.budget, p, q, false, 0, 'agent');
          L = Math.round(L / auction * (0.9 + Math.random() * 0.2));
          const dur = r2(4 + 2.2 * Math.sqrt(item.budget));
          if (!p.campaigns) p.campaigns = [];
          p.campaigns.push({
            id: uid(), kind: 'ad', start: S.gameH, dur, L,
            given: 0, views: 0, visits: 0, ctr: 0.07,
            hist: [], lastHourViews: 0, status: 'live',
            spend: item.budget, agentCampaign: true
          });
          addFatigueToSku(p.wid, Math.min(0.32, 0.16 + item.budget / 900), 'agent');
          launched++;
        }
        toast(`AD AGENT READY — ${launched} CAMPAIGNS LIVE`, 'ok');
        notify('agent', `AD CAMPAIGNS LIVE`, `${launched} campaigns launched by agent`, 'store', 'ok');
        sfx.pop();
        changed = true;
      }
      if (changed) {
        S.agentAdJobs = S.agentAdJobs.filter(j => j.status !== 'done');
        updateBadges();
        requestRender('store');
      }
    }

      const oldQty = S.warehouse[wid] || 0, oldAvg = S.wCostAvg[wid] ?? unitPrice;

      addMoney(-cost);

    function takeLoan(amount) {

      S.debt = r2(S.debt + amount);
      S.loans.push({ id: uid(), principal: amount, rate: 0.08, takenAt: S.gameH, paid: false, accrued: 0 });

    function payDebt(amount) {
      if (amount > S.balance) { toast('NOT ENOUGH CASH', 'bad'); return }
      const actual = Math.min(amount, S.debt);
      if (actual <= 0) { toast('NO DEBT', 'bad'); return }
      addMoney(-actual);
      S.debt = Math.max(0, r2(S.debt - actual));
      S.life.fees = r2(S.life.fees + actual * 0.5);
      S.creditScore = Math.min(850, S.creditScore + 5);
      activity(`Paid debt ${fmt$(actual)}`, -actual);
      toast(`DEBT REDUCED BY ${fmt$(actual)}`);
      const unpaid = S.loans.filter(l => !l.paid);
      for (const loan of unpaid) {
        loan.principal = Math.max(0, loan.principal - actual / Math.max(1, unpaid.length));
        if (loan.principal <= 0) loan.paid = true;
      }
      checkCreditNotify('debt payment');
      hideSheet();
      renderCurrent(); save();
    }

    function sellStock(sym, qty) {
      const st = S.stocks.find(s => s.sym === sym); if (!st) return;
      const have = S.portfolio[sym] || 0;
      if (qty > have) { toast(`ONLY HAVE ${have} SHARES`, 'bad'); return }
      const proceeds = r2(st.price * qty);
      addMoney(proceeds);
      const avgCost = have > 0 ? (S.portfolioCost[sym] || 0) / have : 0;
      S.portfolioCost[sym] = r2(Math.max(0, (S.portfolioCost[sym] || 0) - avgCost * qty));
      S.portfolio[sym] = have - qty;
      if (S.portfolio[sym] <= 0) { S.portfolio[sym] = 0; S.portfolioCost[sym] = 0 }
      S.stockTrades.push({ t: S.gameH, sym, qty, price: st.price, type: 'sell' });
      S.life.revenue = r2(S.life.revenue + proceeds);
      activity(`Sold ${qty}× ${sym} @ ${fmt$(st.price)}`, proceeds);
      toast(`SOLD ${qty}× ${sym} — ${fmt$(proceeds)}`);
      sfx.cash(); hideSheet(); renderCurrent(); save();

      if (netWorth >= 100000000) { wins.push('EMPIRE'); score += Math.log10(netWorth) * 1000 * (effTrust() / 100) }
      if (brand.prestige >= 100 && (S.licenses || []).length >= 3) { wins.push('BRAND'); score += brand.prestige * brand.loyalty * brand.awareness / 100 }
      if (S.franchises.length >= 25 && S.countries.length >= 12) { wins.push('FRANCHISE_KING'); score += S.franchises.length * 100 * (1 + S.countries.length / 12) }
      if (S.life.orders >= 1000 && S.life.lost === 0 && S.problems.filter(p => !p.resolved).length === 0 && effTrust() >= 100) { wins.push('PERFECT_STORE'); score += 1000 * effTrust() / 100 }

    function openTradeSheet(sym, mode) {
      const st = S.stocks.find(s => s.sym === sym); if (!st) return;

      showSheet(`

    function drawSpark(cv, data) {
      if (!cv || !data || data.length < 2) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = cv.clientWidth || cv.width, H = 60;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const min = Math.min(...data), max = Math.max(...data);
      const range = (max - min) || 1;
      ctx.beginPath(); ctx.strokeStyle = '#0C6B43'; ctx.lineWidth = 2;
      for (let i = 0; i < data.length; i++) {
        const x = (i / (data.length - 1)) * (W - 8) + 4;
        const y = H - 6 - ((data[i] - min) / range) * (H - 12);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function sellAllWarehouse(targetFit, wids) {
      if (!wids || !wids.length) return;

      let totalFee = 0, totalQty = 0;
      for (const wid of wids) {
        const w = whById(wid);
        const cp = S.customProducts.find(x => x.wid === wid);
        const cost = S.wCostAvg[wid] ?? w?.cost ?? cp?.cost ?? 10;
        const qty = S.warehouse[wid] || 0;
        totalFee += Math.max(1, Math.round(cost / 1000));
        totalQty += qty;
      }

      if (S.balance < totalFee) {
        toast(`NEED ${fmt$(totalFee - S.balance)} MORE FOR FEES`, 'bad');
        return;
      }

      const USA = coByC('USA');
      const baseIdeal = USA.ideal || 2.2;
      const safeFit = Math.max(0.05, Math.min(1, targetFit));

      let listed = 0, unitsListed = 0, feesPaid = 0;

      for (const wid of wids) {
        const w = whById(wid);
        const cp = S.customProducts.find(x => x.wid === wid);
        if (!w && !cp) continue;
        const qty = S.warehouse[wid] || 0;
        if (qty < 1) continue;

        const cat = cp ? cp.cat : (w ? w.cat : 'HOME');
        const cost = S.wCostAvg[wid] ?? w?.cost ?? cp?.cost ?? 10;
        const listFee = Math.max(1, Math.round(cost / 1000));

        const cfg = CATEGORY_CFG[cat] || CATEGORY_CFG['HOME'];
        const sigma = cfg.sigma;
        const ratio = baseIdeal * Math.exp(sigma * Math.sqrt(-2 * Math.log(safeFit)));
        const price = r2(cost * ratio);

        S.balance = r2(S.balance - listFee);
        S.life.fees = r2(S.life.fees + listFee);
        feesPaid += listFee;

        delete S.warehouse[wid];
        delete S.wCostAvg[wid];

        const name = cp ? cp.name : w.name;
        const luck = Math.random() < .05 ? 3.2 : 1;
        const pool = Math.round((30 + Math.random() * 60) * luck * Math.max(1, globalMult()) * (1 + roleSum('des') * .5));
        S.products.push({
          id: uid(), wid, name: name,
          desc: name + ' — bulk listed.',
          cat, price, cost: r2(cost),
          img: genImg(wid), createdAt: S.gameH,
          pool, estReach: pool,
          views: 0, viewAcc: 0, orders: 0, stock: qty,
          fatigue: 0, fatigue_ad: 0, fatigue_creator: 0, fatigue_agent: 0,
          viral: false, viralUntil: 0, campaigns: [],
          isVip: !!(cp && cp.traits && cp.traits.length),
          vipTraits: (cp && cp.traits) || [], reviews: []
        });
        listed++;
        unitsListed += qty;
      }

      if (listed === 0) { toast('NO ITEMS LISTED', 'bad'); return; }

      pulseBal('debit');
      toast(`LISTED ${listed} SKUs (${unitsListed} units) · FEES ${fmt$(feesPaid)}`, 'ok');
      ticker(`BULK LISTED ${listed} SKUs AT ${Math.round(targetFit * 100)}% FIT`);
      activity(`Bulk listed ${listed} SKUs at ${Math.round(targetFit * 100)}% fit`, -feesPaid);
      sfx.pop();
      hideSheet();
      setPage('store');
      checkRed();
      save();
    }

        if (pg === 'staff' && unpaid) bdg = `<span class="bdg">${unpaid}</span>`;
        if (pg === 'upgrades' && rdReady) bdg = `<span class="bdg">${rdReady}</span>`;
        if (pg === 'rivals' && S.rivalActions && S.rivalActions.length) bdg = `<span class="bdg">${S.rivalActions.length}</span>`;
        return `<button class="tile" data-more="${pg}">${ic(icon)} ${label}${bdg}</button>`;
      }).join('')}
</div>
<div class="m-btns" style="margin-top:14px">
<button class="btn wide ghost" id="moreInstall">${ic('phone', 'sm')} INSTALL APP</button>
<button class="btn wide ghost" id="moreExport">${ic('share', 'sm')} EXPORT DATA</button>
</div>`);
      document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { hideSheet(); setPage(b.dataset.more) });
      $('#moreInstall').onclick = installApp;
      $('#moreExport').onclick = openExportSheet;
    }

    /* ==== GAME OVER / START ==== */
    function showGameOver() {
      showSheet(`<div class="wordmark-lg r">SHUT DOWN</div>
<div class="msub mono" style="font:600 9px var(--mono);letter-spacing:.18em;color:var(--red);margin-top:5px;text-align:center">THE BANK CLOSED YOUR STORE</div>
<div class="mrule"></div>
<div class="proj">
<div class="row"><span>FINAL BALANCE</span><b class="warn">${fmt$(S.balance)}</b></div>
<div class="row"><span>DEBT</span><b class="warn">${fmt$(S.debt)}</b></div>
<div class="row"><span>LIFETIME</span><b>${fmtM(S.life.revenue)}</b></div>
<div class="row"><span>LEGACY SCORE</span><b class="gold">${S.legacy?.score || 0}</b></div>
<div class="row"><span>WINS</span><b>${(S.legacy?.wins || []).join(', ') || 'NONE'}</b></div>
<div class="row"><span>DAYS SURVIVED</span><b>${Math.floor(S.gameH / 24) + 1}</b></div></div>
<div class="m-btns"><button class="btn wide" id="goRestart">START OVER</button>
<button class="btn wide ghost" id="goExport">${ic('share', 'sm')} EXPORT FINAL DATA</button></div>`);
      $('#sheetInner').dataset.nodismiss = '1';
      $('#goRestart').onclick = () => { try { localStorage.removeItem(SAVE_KEY) } catch (e) { } location.reload() };
      $('#goExport').onclick = () => { openExportSheet(); sheetOnClose = showGameOver };
      ticker('STORE SHUT DOWN');
    }
    let _selectedDifficulty = 'easy';
    function showStart(hasSave) {
      showSheet(`<div class="wordmark-lg">SHOP<em style="color:var(--green);font-style:normal">×</em>GRAM</div>
<div class="msub mono" style="font:600 8.5px var(--mono);letter-spacing:.18em;color:var(--ink2);margin-top:4px;text-align:center">FOUNDER'S POCKET · v9 · OFFLINE PWA</div>
<div class="mrule"></div>
<div class="rules">
<div>${ic('box', 'sm')}<span>BUY STOCK IN <b>WHOLESALE</b>, LIST IN <b>STOREFRONT</b>. REALISTIC MARGINS SELL.</span></div>
<div>${ic('mega', 'sm')}<span>BOOST POSTS, SIGN <b>CREATORS</b>, CATCH <b>VIP DROPS</b>. <b>RIVALS SCALE WITH YOU.</b></span></div>
<div>${ic('bank', 'sm')}<span>LOANS, <b>UPGRADES</b>, <b>STOCKS</b>, <b>R&D</b>. SHIP ON TIME.</span></div>
<div>${ic('crown', 'sm')}<span>UNLOCK MARKETS. <b>WIN CONDITIONS</b> & <b>LEGACY SCORE</b>. <b>PRESTIGE</b> AT $100K.</span></div>
</div>
<div class="diffstack">
<button class="diff-card ${_selectedDifficulty === 'hard' ? 'sel' : ''}" data-diff="hard"><b>🔥 HARD — $10,000</b><span>Hardcore. High risk.</span></button>
<button class="diff-card ${_selectedDifficulty === 'medium' ? 'sel' : ''}" data-diff="medium"><b>⚡ MEDIUM — $50,000</b><span>Balanced.</span></button>
<button class="diff-card ${_selectedDifficulty === 'easy' ? 'sel' : ''}" data-diff="easy"><b>🌱 kids — $100,000</b><span>Learn the ropes.</span></button>
</div>
<div class="m-cap"><span>STARTING CAPITAL</span><b id="capDisplay">$100,000.00</b></div>
<button class="btn wide green" id="btnBegin">OPEN THE STORE — <span id="btnBeginLabel">kids $100,000</span></button>
${hasSave ? `<button class="btn wide ghost" id="btnResume">${ic('play', 'sm')} RESUME — DAY ${Math.floor(S.gameH / 24) + 1}</button>` : ''}
</div>
<div class="startfoot">AUTOSAVE EVERY 5S · NO AI · PROCEDURAL</div>`);
      if (!hasSave) $('#sheetInner').dataset.nodismiss = '1';
      const updateCap = () => {
        const map = { hard: 10000, medium: 50000, easy: 100000 };
        const labels = { hard: 'HARD', medium: 'MEDIUM', easy: 'kids' };
        const bal = map[_selectedDifficulty] || 10000;
        $('#capDisplay').textContent = '$' + bal.toLocaleString('en-US', { minimumFractionDigits: 2 });
        $('#btnBeginLabel').textContent = (labels[_selectedDifficulty] || _selectedDifficulty.toUpperCase()) + ' $' + bal.toLocaleString('en-US');
        document.querySelectorAll('.diff-card').forEach(c => c.classList.toggle('sel', c.dataset.diff === _selectedDifficulty));
      };
      document.querySelectorAll('.diff-card').forEach(card => {
        card.onclick = () => { _selectedDifficulty = card.dataset.diff; updateCap() };
      });
      updateCap();
      $('#btnBegin').onclick = () => {
        ac();
        try { localStorage.removeItem(SAVE_KEY) } catch (e) { }
        const prevSettings = JSON.parse(JSON.stringify(S.settings || {}));
        const balMap = { hard: 10000, medium: 50000, easy: 100000 };
        let startBal = balMap[_selectedDifficulty] || 10000;
        let pbData = { founderPoints: 0, prestigeLevel: 0, permanentBonuses: {} };
        try { const pbRaw = localStorage.getItem(PRESTIGE_KEY); if (pbRaw) pbData = JSON.parse(pbRaw) } catch (e) { }
        startBal = Math.round(startBal * (1 + (pbData.permanentBonuses?.startCash || 0) * 0.10));
        S = DEF(startBal);
        S.settings = Object.assign(DEF().settings, prevSettings);
        S.settings.cats = Object.assign({ orders: true, complaints: true, staff: true, stock: true, money: true, growth: true }, prevSettings.cats || {});
        S.founderPoints = pbData.founderPoints || 0;
        S.prestigeLevel = pbData.prestigeLevel || 0;
        S.permanentBonuses = pbData.permanentBonuses || {};
        S.difficulty = _selectedDifficulty;
        S.trust = 72 + (S.permanentBonuses.startingTrust || 0);
        S.brand.awareness = 10 + (S.permanentBonuses.startReputation || 0) * 2;
        S.brand.loyalty = 10 + (S.permanentBonuses.startReputation || 0) * 2;
        S.brand.prestige = 10 + (S.permanentBonuses.startReputation || 0) * 2;
        S.balHist = [S.balance];
        S.paused = false; S.speed = 1;
        refreshWholesale(); rotateCreators(); rollTrends(); initCompetitors();
        rollEconomy();
        dispBal = S.balance; started = true; hideSheet(true);
        updateSpeedUI(); updateBadges();
        seedTicker(true); save(); renderCurrent();
        const startLabels = { hard: 'HARD', medium: 'MEDIUM', easy: 'kids' };
        algoToast(`WELCOME, FOUNDER — $${startBal.toLocaleString('en-US')} · ${startLabels[_selectedDifficulty] || _selectedDifficulty.toUpperCase()}`);
        setTimeout(() => algoToast('STEP 1 — TAP <b>BUY</b> (BOTTOM) AND GET STOCK.'), 2800);
        setTimeout(() => algoToast('STEP 2 — LIST IN <b>STORE</b>, THEN <b>BOOST</b> THE POST.'), 6500);
      };
      const r = $('#btnResume');
      if (r) r.onclick = () => {
        ac();
        S.paused = false; if (!S.speed) S.speed = 1;
        started = true; hideSheet(true); updateSpeedUI(); updateBadges();
        seedTicker(false);
        ticker(`RESUMED — DAY ${Math.floor(S.gameH / 24) + 1}`);
      };
    }
    function seedTicker(fresh) {
      if (fresh) {
        tickerPush('WELCOME TO SHOP×GRAM v9 POCKET<i>◆</i>');
        tickerPush('RIVALS NOW SCALE WITH YOUR REVENUE<i>◆</i>');
      } else tickerPush('SESSION RESUMED<i>◆</i>');
      tickerPush('TAP TICKER OR BELL FOR EVENT FEED<i>◆</i>');
      tickerPush('DISABLE TOASTS IN SETTINGS IF THEY ANNOY YOU<i>◆</i>');
      tickerPush('R&D NOW UNLIMITED PRICING<i>◆</i>');
      tickerPush('12 STAFF ROLES INCLUDING LEGAL, PR, ANALYST<i>◆</i>');
      tickerPush('PRESTIGE AT $100K LIFETIME REVENUE<i>◆</i>');
    }

    /* ==== FOCUS / INPUT PRESERVATION ==== */
    function captureFocusState(el) {
      const a = document.activeElement;
      if (!a || !el || !el.contains(a)) return null;
      const info = { tag: a.tagName };
      if (a.id) info.id = a.id;
      const d = a.dataset || {};
      if (d.qty) info.qty = d.qty;
      else if (d.plus) info.plus = d.plus;
      else if (d.minus) info.minus = d.minus;
      else if (d.ad) info.ad = d.ad;
      try { if (a.selectionStart != null) { info.selStart = a.selectionStart; info.selEnd = a.selectionEnd } } catch (e) { }
      return info;
    }
    function restoreFocusState(el, info) {
      if (!info || !el) return;
      let target = null;
      if (info.id) target = document.getElementById(info.id);
      else if (info.qty) target = el.querySelector(`[data-qty="${info.qty}"]`);
      else if (info.plus) target = el.querySelector(`[data-plus="${info.plus}"]`);
      else if (info.minus) target = el.querySelector(`[data-minus="${info.minus}"]`);
      else if (info.ad) target = el.querySelector(`[data-ad="${info.ad}"]`);
      if (target && el.contains(target)) {
        try { target.focus({ preventScroll: true }) } catch (e) { }
        if (info.selStart != null && target.setSelectionRange) { try { target.setSelectionRange(info.selStart, info.selEnd) } catch (e) { } }
      }
    }
    function captureInputValues(el) {
      const m = {};
      if (!el) return m;
      el.querySelectorAll('input[id],textarea[id],select[id]').forEach(i => {
        if (i.type === 'checkbox' || i.type === 'radio') m[i.id] = { checked: i.checked };
        else m[i.id] = { value: i.value };
      });
      el.querySelectorAll('input[data-qty]').forEach(i => { m['_qty_' + i.dataset.qty] = { value: i.value } });
      return m;
    }
    function restoreInputValues(el, m) {
      if (!el || !m) return;
      for (const k in m) {
        if (k.startsWith('_qty_')) {
          const wid = k.slice(5);
          const i = el.querySelector(`[data-qty="${wid}"]`);
          if (i) { i.value = m[k].value; try { i.dispatchEvent(new Event('input', { bubbles: true })) } catch (e) { } }
          continue;
        }
        const i = document.getElementById(k);
        if (!i || !el.contains(i)) continue;
        if (m[k].checked !== undefined) i.checked = m[k].checked;
        else i.value = m[k].value;
      }
    }

    /* ==== SPEED / TOP BAR ==== */
    function updateSpeedUI() {
      $('#spdPause').classList.toggle('active', !!S.paused);
      $('#spd1').classList.toggle('active', !S.paused && S.speed === 1);
      $('#spd3').classList.toggle('active', !S.paused && S.speed === 3);
      $('#spd5').classList.toggle('active', !S.paused && S.speed === 5);
    }
    $('#spdPause').onclick = () => { if (S.over || !started) return; S.paused = !S.paused; updateSpeedUI() };
    $('#spd1').onclick = () => { if (!started) return; S.paused = false; S.speed = 1; updateSpeedUI() };
    $('#spd3').onclick = () => { if (!started) return; S.paused = false; S.speed = 3; updateSpeedUI() };
    $('#spd5').onclick = () => { if (!started) return; S.paused = false; S.speed = 5; updateSpeedUI() };
    $('#btnBell').onclick = () => openNotifSheet();
    $('#balWrap').onclick = () => { if (started) setPage('stats') };
    $('#tickerBar').onclick = () => openNotifSheet();
    document.querySelectorAll('#tabbar .tabbtn').forEach(b => b.onclick = () => {
      if (!started) return;
      const t = b.dataset.tab;
      if (t === 'more') openMoreSheet();
      else { hideSheet(); setPage(t) }
    });
    addEventListener('keydown', e => {
      if (e.key === ' ' && !e.repeat) {
        const a = document.activeElement;
        if (a && ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(a.tagName)) return;
        if (sheetOpen) return;
        if (!started || S.over) return;
        e.preventDefault();
        S.paused = !S.paused; updateSpeedUI();
      }
    });

    /* ==== ROUTING ==== */
    const PAGE_TAB = { store: 'store', wholesale: 'wholesale', orders: 'orders', bank: 'bank', stats: 'more', creators: 'more', global: 'more', rivals: 'more', franchise: 'more', upgrades: 'more', market: 'more', staff: 'more', settings: 'more' };
    function setPage(p) {
      page = p;
      pendingRenders.delete(p);
      document.querySelectorAll('#tabbar .tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === (PAGE_TAB[p] || 'store')));
      const el = $('#pageBody');
      el._isNavigating = true;
      renderCurrent();
      el.scrollTop = 0;
      if (S.analytics) { S.analytics.pageViews = S.analytics.pageViews || {}; S.analytics.pageViews[p] = (S.analytics.pageViews[p] || 0) + 1 }
      setTimeout(() => { el._isNavigating = false }, 100);
    }
    function renderCurrent() {
      const el = $('#pageBody');
      const isNav = el && el._isNavigating;
      const prevScroll = isNav ? 0 : el.scrollTop;
      const focusInfo = isNav ? null : captureFocusState(el);
      const inputVals = isNav ? null : captureInputValues(el);
      switch (page) {
        case 'store': renderStore(); break;
        case 'wholesale': renderWholesale(); break;
        case 'creators': renderCreators(); break;
        case 'orders': renderOrders(); break;
        case 'bank': renderBank(); break;
        case 'market': renderMarket(); break;
        case 'rivals': renderCompetitors(); break;
        case 'franchise': renderFranchise(); break;
        case 'upgrades': renderUpgrades(); break;
        case 'staff': renderStaff(); break;
        case 'settings': renderSettings(); break;
        case 'global': renderGlobal(); break;
        case 'stats': renderStats(); break;
        default: renderStore();
      }
      if (!isNav && el) {
        if (inputVals) restoreInputValues(el, inputVals);
        if (focusInfo) restoreFocusState(el, focusInfo);
        if (prevScroll > 0) requestAnimationFrame(() => { el.scrollTop = prevScroll });
      }
    }

    /* ==== MAIN LOOP ==== */
    let last = performance.now(), accH = 0, tickAcc = 0;
    let _lastClock = '', _lastEcon = '', _lastBal = '';
    function updateTopLive() {
      const cs = clockStr() + (S.paused ? ' · ⏸' : '');
      if (cs !== _lastClock) { const el = $('#clockEl'); el.textContent = cs; el.classList.toggle('paused', !started || S.paused || S.over); _lastClock = cs }
      const balEl = $('#balEl'); const bt = fmt$(dispBal);
      if (bt !== _lastBal) { balEl.textContent = bt; balEl.classList.toggle('neg', dispBal < 0); _lastBal = bt }
      const et = $('#econTop'); const etxt = `${S.economy.phase.toUpperCase()} ×${S.economy.index.toFixed(2)}`;
      if (etxt !== _lastEcon) { et.className = 'econ-chip ' + S.economy.phase; et.textContent = etxt; _lastEcon = etxt }
    }
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.1); last = now;
      const running = started && !S.paused && !S.over;
      const h = dt * HPS * (running ? S.speed : 0);
      if (h > 0) { S.gameH += h; simFrame(h); accH += h; while (accH >= 1) { accH -= 1; hourly() } }
      dispBal += (S.balance - dispBal) * Math.min(1, dt * 7);
      if (Math.abs(dispBal - S.balance) < .005) dispBal = S.balance;
      updateTopLive();
      tickAcc += dt;
      if (tickAcc >= 0.25) {
        tickAcc = 0;
        if (page === 'store') tickStore();
        if (page === 'orders') tickOrders();
        if (page === 'bank') tickBank();
        if (page === 'wholesale') tickWholesale();
        if (sheetOpen && $('#sheetInner').dataset.oid) tickOrders();
      }
      tickTicker(dt);
      if (pendingRenders.size) {
        const shouldRender = pendingRenders.has(page);
        pendingRenders.clear();
        const ae = document.activeElement;
        const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
        if (shouldRender && !typing && !sheetOpen && started) renderCurrent();
      }
      if (page === 'orders' && started && !sheetOpen) {
        const sig = ordersSignature();
        if (sig !== _ordersSig) {
          const ae = document.activeElement;
          const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
          if (!typing) renderCurrent();
          else _ordersSig = sig;
        }
      }
      requestAnimationFrame(loop);
    }

    /* ==== PWA ==== */
    let deferredPrompt = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e });
    addEventListener('appinstalled', () => { deferredPrompt = null; toast('APP INSTALLED', 'ok') });
    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice } catch (e) { }
        deferredPrompt = null;
      } else {
        showSheet(`
<div class="shead"><div><h3>Install the App</h3><div class="msub">ADD TO HOME SCREEN</div></div><button class="iconbtn" data-mclose aria-label="Close">${ic('x')}</button></div>
<div class="rules">
<div>${ic('phone', 'sm')}<span><b>ANDROID / CHROME:</b> ⋮ MENU → "INSTALL APP" OR "ADD TO HOME SCREEN".</span></div>
<div>${ic('phone', 'sm')}<span><b>iOS / SAFARI:</b> SHARE BUTTON → "ADD TO HOME SCREEN".</span></div>
</div>
<div class="m-btns"><button class="btn wide ghost" data-mclose>GOT IT</button></div>`);
      }
    }

    /* ==== BOOT ==== */
    function boot() {
      if (!S.balHist || !S.balHist.length) S.balHist = [S.balance];
      let raw = null; try { raw = JSON.parse(localStorage.getItem(SAVE_KEY)) } catch (e) { }
      let hasSave = false;
      if (raw && (raw.v === 9 || raw.v === 8)) {
        const fresh = DEF();
        S = Object.assign(fresh, raw);
        for (const k of ['life', 'settings', 'warehouse', 'wCostAvg', 'wcost', 'mstock', 'invSettings', 'paySettings', 'stats', 'upgrades', 'economy', 'portfolio', 'portfolioCost', 'permanentBonuses', 'brand', 'legacy', 'analytics', 'objectives', 'commodities', 'segments']) {
          if (fresh[k] && typeof fresh[k] === 'object' && !Array.isArray(fresh[k])) S[k] = Object.assign({}, fresh[k], raw[k] || {});
        }
        for (const k of ['products', 'orders', 'problems', 'payroll', 'staff', 'countries', 'creators', 'trends', 'effects', 'pens', 'balHist', 'activity', 'eventLog', 'shown', 'branchesOwned', 'customBranches', 'competitors', 'loans', 'stockTrades', 'franchises', 'rdProjects', 'customProducts', 'vipStock', 'stocks', 'myVipCatalog', 'notifs', 'rivalActions', 'crises', 'licenses', 'agentJobs', 'agentAdJobs']) {
          if (!Array.isArray(S[k])) S[k] = fresh[k];
        }
        if (!S.settings.cats) S.settings.cats = { orders: true, complaints: true, staff: true, stock: true, money: true, growth: true };
        for (const c of NOTIF_CATS) if (S.settings.cats[c.id] === undefined) S.settings.cats[c.id] = true;
        if (!S.notifKeys) S.notifKeys = {};
        if (!S.balHist.length) S.balHist = [S.balance];
        if (S.settings.toasts === undefined) S.settings.toasts = true;

        S.paused = false;
        if (!S.speed) S.speed = 1;
        hasSave = true;
      } else {
        raw = null;
        refreshWholesale(); rotateCreators(); rollTrends(); initCompetitors();
      }
      try {
        const pbRaw = localStorage.getItem(PRESTIGE_KEY);
        if (pbRaw) {
          const pbj = JSON.parse(pbRaw);
          if (!hasSave) { S.founderPoints = pbj.founderPoints || 0; S.prestigeLevel = pbj.prestigeLevel || 0; S.permanentBonuses = pbj.permanentBonuses || {} }
        }
      } catch (e) { }

      // ===== MIGRATION: rebuild myVipCatalog from customProducts if entries are missing =====
      if (!S.myVipCatalog) S.myVipCatalog = [];
      for (const cp of (S.customProducts || [])) {
        if (!cp || !cp.wid) continue;
        if (!S.myVipCatalog.find(v => v.wid === cp.wid)) {
          const cost = cp.cost || 100;
          S.myVipCatalog.push({
            id: uid(),
            wid: cp.wid,
            name: cp.name || 'Custom',
            cat: cp.cat || 'HOME',
            baseCost: cost,
            cost: r2(cost * 1.35),
            msrp: cp.msrp || r2(cost * 3),
            traits: cp.traits || [],
            stock: 6,
            maxStock: 12,
            lastRefresh: S.gameH
          });
        }
      }
      // ===== END MIGRATION =====
      dispBal = S.balance;
      $('#tickerBar').style.display = S.settings.ticker === false ? 'none' : '';
      updateSpeedUI(); updateBadges();
      setPage('store');
      ensureSW();
      requestAnimationFrame(t => { last = t; requestAnimationFrame(loop) });
      showStart(hasSave);
    }
    boot();
  </script>
</body>

</html>
